# Builds the browser version of Shadow Road and publishes it to GitHub Pages
# on every push to main. The game is then playable at https://<user>.github.io/<repo>/
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pygame-ce pygbag==0.9.3

      - name: Run tests
        run: python -m unittest discover tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Build web version
        run: python tools/build_web.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_build/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
